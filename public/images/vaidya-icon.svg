<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#1F332A" flood-opacity="0.08" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1F332A" flood-opacity="0.04" />
    </filter>
    <linearGradient id="circleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFBF8" />
      <stop offset="100%" stop-color="#F5F2EB" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="32" fill="transparent" />

  <!-- Outer Badge Group with Soft Shadow -->
  <g filter="url(#softShadow)">
    <!-- Badge Background Circle -->
    <circle cx="256" cy="220" r="160" fill="url(#circleBg)" stroke="#8A9A93" stroke-width="3.5" />
    <circle cx="256" cy="220" r="152" fill="none" stroke="#8A9A93" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 4" />
  </g>

  <!-- Centered Heart with ECG Pulse Line Icon -->
  <g transform="translate(256, 220)">
    <!-- Heart Outline Path -->
    <path 
      d="M 0, -42 
         C 26, -92 108, -82 108, -8 
         C 108, 48 52, 94 0, 134 
         C -52, 94 -108, 48 -108, -8 
         C -108, -82 -26, -92 0, -42 Z" 
      fill="none" 
      stroke="#4A5C52" 
      stroke-width="12" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />

    <!-- Cutting ECG Pulse Line with Smooth Waveform -->
    <path 
      d="M -126, 12 
         L -52, 12 
         L -32, -38 
         L -8, 62 
         L 16, -18 
         L 36, 28 
         L 52, 12 
         L 126, 12" 
      fill="none" 
      stroke="#4A5C52" 
      stroke-width="12" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />

    <!-- Pulsing Node Accent -->
    <circle cx="16" cy="-18" r="5" fill="#4A5C52" />
  </g>

  <!-- Typography Below Badge -->
  <text 
    x="256" 
    y="442" 
    text-anchor="middle" 
    font-family="'DM Sans', system-ui, -apple-system, sans-serif" 
    font-size="34" 
    font-weight="700" 
    letter-spacing="0.04em" 
    fill="#4A5C52"
  >
    Vaidya Consult
  </text>
  <text 
    x="256" 
    y="472" 
    text-anchor="middle" 
    font-family="'DM Sans', system-ui, -apple-system, sans-serif" 
    font-size="14" 
    font-weight="600" 
    letter-spacing="0.22em" 
    fill="#8A9A93"
  >
    AYURVEDIC HEALTHCARE
  </text>
</svg>
