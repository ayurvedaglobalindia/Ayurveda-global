<svg width="800" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="800" fill="#F5F0E8"/>
  <g transform="translate(400,400)">
    <!-- Wooden table surface -->
    <ellipse cx="0" cy="350" rx="380" ry="80" fill="#8B7355" opacity="0.3"/>
    <!-- Bottle -->
    <rect x="-80" y="-200" width="160" height="350" rx="20" fill="#1B3A2F"/>
    <rect x="-30" y="-240" width="60" height="50" rx="5" fill="#2D5A3D"/>
    <rect x="-40" y="-260" width="80" height="30" rx="5" fill="#C9A84C"/>
    <rect x="-70" y="-150" width="140" height="200" rx="10" fill="#F5F0E8" stroke="#C9A84C" stroke-width="2"/>
    <text x="0" y="-100" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#1B3A2F">BODY</text>
    <text x="0" y="-70" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#4A7C59">Essential Nutrition</text>
    <text x="0" y="-30" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#6B8E6E">60 Capsules</text>
    <!-- Herbs around -->
    <g transform="translate(-200, -100)">
      <ellipse cx="0" cy="0" rx="40" ry="20" fill="#4A7C59" opacity="0.3"/>
      <text x="0" y="5" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#4A7C59">Ashwagandha</text>
    </g>
    <g transform="translate(200, -100)">
      <ellipse cx="0" cy="0" rx="40" ry="20" fill="#6B8E6E" opacity="0.3"/>
      <text x="0" y="5" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#6B8E6E">Shatavari</text>
    </g>
    <g transform="translate(-200, 200)">
      <ellipse cx="0" cy="0" rx="40" ry="20" fill="#C9A84C" opacity="0.3"/>
      <text x="0" y="5" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#C9A84C">Amla</text>
    </g>
    <g transform="translate(200, 200)">
      <ellipse cx="0" cy="0" rx="40" ry="20" fill="#5D8A6E" opacity="0.3"/>
      <text x="0" y="5" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#5D8A6E">Triphala</text>
    </g>
    <!-- Wellness elements -->
    <g transform="translate(-300, 300)">
      <circle cx="0" cy="0" r="30" fill="#4A7C59" opacity="0.1"/>
      <text x="0" y="5" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4A7C59">Daily Wellness</text>
    </g>
    <g transform="translate(300, 300)">
      <circle cx="0" cy="0" r="30" fill="#C9A84C" opacity="0.1"/>
      <text x="0" y="5" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#C9A84C">Natural Energy</text>
    </g>
  </g>
</svg>