<svg width="800" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="800" fill="#F5F0E8"/>
  <g transform="translate(400,400)">
    <!-- Wooden surface -->
    <ellipse cx="0" cy="350" rx="380" ry="80" fill="#8B7355" opacity="0.3"/>
    <!-- Spray bottle -->
    <rect x="-60" y="-200" width="120" height="350" rx="15" fill="#1B3A2F"/>
    <rect x="-25" y="-250" width="50" height="60" rx="5" fill="#2D5A3D"/>
    <ellipse cx="0" cy="-250" rx="20" ry="8" fill="#C9A84C"/>
    <rect x="-30" y="-280" width="60" height="30" rx="5" fill="#C9A84C"/>
    <rect x="-50" y="-180" width="100" height="250" rx="10" fill="#F5F0E8" stroke="#C9A84C" stroke-width="2"/>
    <text x="0" y="-120" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#1B3A2F">STAYMAX+</text>
    <text x="0" y="-80" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#C9A84C">Delay Spray</text>
    <text x="0" y="-40" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#4A7C59">Natural Endurance</text>
    <text x="0" y="0" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#C9A84C">30 ml</text>
    <text x="0" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#8B7355">For Men • 18+</text>
    <!-- Herbs -->
    <g transform="translate(-200, -100)">
      <ellipse cx="0" cy="0" rx="45" ry="22" fill="#4A7C59" opacity="0.2"/>
      <text x="0" y="5" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#4A7C59">Ashwagandha</text>
    </g>
    <g transform="translate(200, -100)">
      <ellipse cx="0" cy="0" rx="45" ry="22" fill="#6B8E6E" opacity="0.2"/>
      <text x="0" y="5" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#6B8E6E">Shilajit</text>
    </g>
    <g transform="translate(-200, 200)">
      <ellipse cx="0" cy="0" rx="45" ry="22" fill="#C9A84C" opacity="0.2"/>
      <text x="0" y="5" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#C9A84C">Safed Musli</text>
    </g>
    <g transform="translate(200, 200)">
      <ellipse cx="0" cy="0" rx="45" ry="22" fill="#5D8A6E" opacity="0.2"/>
      <text x="0" y="5" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#5D8A6E">Aloe Vera</text>
    </g>
    <!-- Wellness tags -->
    <g transform="translate(-300, 300)">
      <circle cx="0" cy="0" r="35" fill="#4A7C59" opacity="0.1"/>
      <text x="0" y="5" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4A7C59">Men's Wellness</text>
    </g>
    <g transform="translate(300, 300)">
      <circle cx="0" cy="0" r="35" fill="#C9A84C" opacity="0.1"/>
      <text x="0" y="5" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#C9A84C">Natural Support</text>
    </g>
  </g>
</svg>