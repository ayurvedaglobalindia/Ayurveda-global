<svg width="800" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="800" fill="#F5F0E8"/>
  <g transform="translate(400,400)">
    <!-- Box packaging -->
    <path d="M-120,-150 L120,-150 L100,150 L-100,150 Z" fill="#E8DCC8" stroke="#C9A84C" stroke-width="2"/>
    <path d="M120,-150 L160,-120 L160,180 L100,150 Z" fill="#D4C4A8" stroke="#C9A84C" stroke-width="1"/>
    <path d="M-120,-150 L-80,-120 L160,-120 L120,-150 Z" fill="#E8DCC8" stroke="#C9A84C" stroke-width="1"/>
    <!-- Lid -->
    <rect x="-130" y="-170" width="260" height="30" rx="5" fill="#C9A84C"/>
    <!-- Box label -->
    <rect x="-100" y="-120" width="200" height="200" rx="10" fill="#F5F0E8" stroke="#C9A84C" stroke-width="2"/>
    <text x="0" y="-70" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#1B3A2F">STAYMAX+</text>
    <text x="0" y="-30" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#C9A84C">Delay Spray</text>
    <text x="0" y="10" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#4A7C59">Natural Endurance</text>
    <text x="0" y="50" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#C9A84C">30 ml</text>
    <text x="0" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#8B7355">For Men • 18+</text>
  </g>
</svg>