<svg width="400" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="botanical" patternUnits="userSpaceOnUse" width="200" height="200">
      <g stroke="#4A7C59" stroke-width="0.5" fill="none" opacity="0.15">
        <!-- Leaf 1 -->
        <path d="M100,20 Q120,10 140,20 Q150,50 140,80 Q120,90 100,80 Q80,50 100,20"/>
        <!-- Leaf 2 -->
        <path d="M50,100 Q70,90 90,100 Q100,130 90,160 Q70,170 50,160 Q40,130 50,100"/>
        <!-- Leaf 3 -->
        <path d="M150,100 Q170,90 190,100 Q200,130 190,160 Q170,170 150,160 Q140,130 150,100"/>
        <!-- Small leaves -->
        <path d="M30,30 Q40,25 50,30 Q55,45 50,55 Q40,60 30,55 Q25,45 30,30"/>
        <path d="M170,30 Q180,25 190,30 Q195,45 190,55 Q180,60 170,55 Q165,45 170,30"/>
        <!-- Vine lines -->
        <path d="M100,100 Q120,80 150,60" stroke-width="0.8"/>
        <path d="M100,100 Q80,80 50,60" stroke-width="0.8"/>
        <path d="M100,100 Q120,120 150,140" stroke-width="0.8"/>
        <path d="M100,100 Q80,120 50,140" stroke-width="0.8"/>
      </g>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#botanical)"/>
</svg>